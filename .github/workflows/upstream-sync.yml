name: Sync Waveshare Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/waveshareteam/e-Paper.git
  UPSTREAM_BRANCH: master
  VENDOR_BRANCH: vendor/upstream
  STARTER_BRANCH: starter/http-image-retriever

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags --prune upstream "$UPSTREAM_BRANCH"
          git fetch --no-tags --prune origin "$STARTER_BRANCH" "$VENDOR_BRANCH" || true

      - name: Refresh vendor mirror branch
        run: |
          git checkout -B "$VENDOR_BRANCH" "upstream/$UPSTREAM_BRANCH"
          git push --force-with-lease origin "$VENDOR_BRANCH"

      - name: Check whether starter branch needs an update
        id: diff_check
        run: |
          if git diff --quiet "origin/$STARTER_BRANCH..$VENDOR_BRANCH"; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update upstream sync pull request
        if: steps.diff_check.outputs.has_diff == 'true'
        env:
          SYNC_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          if [ -n "$SYNC_PR_TOKEN" ]; then
            export GH_TOKEN="$SYNC_PR_TOKEN"
            echo "Using SYNC_PR_TOKEN for pull request operations."
          else
            export GH_TOKEN="$GITHUB_TOKEN_FALLBACK"
            echo "Using default GITHUB_TOKEN for pull request operations."
          fi

          echo "GitHub actor: $GITHUB_ACTOR"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Base branch: $STARTER_BRANCH"
          echo "Head branch: $VENDOR_BRANCH"
          echo "Head commit: $(git rev-parse --short "$VENDOR_BRANCH")"

          gh auth status || true
          gh repo view "$GITHUB_REPOSITORY" \
            --json nameWithOwner,viewerPermission,defaultBranchRef,isPrivate \
            --jq '{repo: .nameWithOwner, viewerPermission: .viewerPermission, defaultBranch: .defaultBranchRef.name, isPrivate: .isPrivate}' || true

          owner="${GITHUB_REPOSITORY%%/*}"
          existing_pr="$(
            gh api "repos/$GITHUB_REPOSITORY/pulls" \
              --method GET \
              -f state="open" \
              -f base="$STARTER_BRANCH" \
              -f head="$owner:$VENDOR_BRANCH" \
              --jq '.[0].number'
          )" || existing_pr=""

          latest_upstream="$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")"
          pr_title="Merge latest Waveshare upstream into starter branch (${latest_upstream})"
          pr_body="$(cat <<EOF
          Automated upstream sync PR.

          This workflow refreshed \`$VENDOR_BRANCH\` from the official Waveshare repository and is proposing those vendor updates for \`$STARTER_BRANCH\`.

          Flow:
          - Fetch \`$UPSTREAM_BRANCH\` from the Waveshare upstream repository
          - Reset \`$VENDOR_BRANCH\` to that upstream state
          - Open or update a PR from \`$VENDOR_BRANCH\` into \`$STARTER_BRANCH\`

          Review and merge this PR when the vendor changes look correct. If GitHub reports conflicts, resolve them intentionally instead of forcing the update.
          EOF
          )"

          if [ -n "$existing_pr" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$existing_pr" \
              --method PATCH \
              -f title="$pr_title" \
              -f body="$pr_body"
          else
            create_output="$(
              gh api "repos/$GITHUB_REPOSITORY/pulls" \
                --method POST \
                -f title="$pr_title" \
                -f head="$VENDOR_BRANCH" \
                -f base="$STARTER_BRANCH" \
                -f body="$pr_body" 2>&1
            )" || {
              if printf '%s' "$create_output" | grep -Eq "Resource not accessible by (integration|personal access token)"; then
                echo "::error::Pull request creation is blocked for the current token. For GITHUB_TOKEN, confirm Actions workflow permissions are read/write and PR creation is allowed. For SYNC_PR_TOKEN, confirm the token has repository access plus pull request and contents write permissions."
              fi

              printf '%s\n' "$create_output"
              exit 1
            }

            printf '%s\n' "$create_output"
          fi
